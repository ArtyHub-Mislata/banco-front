<div class="login-page">
  <div class="login-card">
    <h2 class="login-title">Iniciar sesión</h2>

    <form (ngSubmit)="onLogin(loginForm)" #loginForm="ngForm" class="login-form">
      <!-- Usuario -->
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="credential.username"
          name="login"
          required
          #loginCtrl="ngModel"
          placeholder="Tu usuario"
        />
      </div>
      @if (loginCtrl.invalid && (loginCtrl.dirty || loginCtrl.touched)) {
        <div class="form-error">El usuario es obligatorio</div>
      }

      <!-- Contraseña -->
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="credential.password"
          name="password"
          required
          #passwordCtrl="ngModel"
          placeholder="Tu contraseña"
        />
      </div>
      @if (passwordCtrl.invalid && (passwordCtrl.dirty || passwordCtrl.touched)) {
        <div class="form-error">La contraseña es obligatoria</div>
      }

      <!-- Error general -->
      @if (generalError) {
        <div class="form-general-error">
          {{ generalError }}
        </div>
      }

      <!-- Botones -->
      <div class="login-actions">
        <a c-button funcion="alternativa" importancia="terciaria" tamano="mediano" routerLink="/">
          Volver
        </a>

        <button
          c-button
          funcion="normal"
          importancia="primaria"
          tamano="mediano"
          [disabled]="loginForm.invalid || loading"
        >
          Entrar
        </button>
      </div>
    </form>
  </div>
</div>
